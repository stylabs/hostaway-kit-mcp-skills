name: Publish server.json to MCP Registry

on:
  workflow_dispatch:
  # One-shot: merging the commit that adds this push trigger runs the job.
  # workflow_dispatch is not available to this token (HTTP 403). The follow-up
  # commit removes this push trigger; that commit's workflow file no longer
  # matches, so it does not publish again.
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-mcp-registry.yml

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # MCP Registry GitHub OIDC
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Require this version to already be on npm
        run: |
          PKG="$(node -p "require('./package.json').version")"
          SRV="$(node -p "require('./server.json').version")"
          NPMV="$(node -p "require('./server.json').packages[0].version")"
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$NPMV" ]; then
            echo "version mismatch package.json (${PKG}), server.json (${SRV}), packages[0].version (${NPMV})"
            exit 1
          fi
          LIVE="$(npm view "hostaway-kit@${PKG}" version)"
          if [ "$LIVE" != "$PKG" ]; then
            echo "hostaway-kit@${PKG} is not on npm (npm view returned: ${LIVE:-nothing}). This workflow does not publish to npm."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
